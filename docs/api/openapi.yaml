openapi: 3.0.3
info:
  title: Grandline Races API
  description: Phase 1 races endpoints plus Phase 6 leaderboard and participation. Auth via Cognito JWT (Bearer token).
  version: 0.2.0

servers:
  - url: https://{apiId}.execute-api.{region}.amazonaws.com
    variables:
      apiId: {}
      region:
        default: eu-north-1

security:
  - bearerAuth: []

paths:
  /races:
    get:
      summary: Get race by invite code
      operationId: getRaceByInviteCode
      parameters:
        - name: inviteCode
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Race found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Race'
        '401':
          description: Missing or invalid token
        '404':
          description: No race with that invite code

  /races/{id}:
    get:
      summary: Get race by id
      operationId: getRaceById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Race found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Race'
        '401':
          description: Missing or invalid token
        '404':
          description: No race with that id

  /races/{id}/leaderboard:
    get:
      summary: Get race leaderboard
      operationId: getRaceLeaderboard
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Race found. entries may be empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardResponse'
        '401':
          description: Missing or invalid token
        '404':
          description: No race with that id

  /races/{id}/participation:
    put:
      summary: Upsert the caller's race participation
      operationId: putRaceParticipation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipationRequest'
      responses:
        '200':
          description: Participation upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipationResponse'
        '400':
          description: Invalid body
        '401':
          description: Missing or invalid token
        '404':
          description: No race with that id
        '409':
          description: Finished participation cannot return to in_progress

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito ID or access token

  schemas:
    Race:
      type: object
      required:
        - id
        - name
        - checkpoints
        - amot
        - start_window
        - invite_code
        - paid
      properties:
        id:
          type: string
        name:
          type: string
        checkpoints:
          type: array
          items:
            type: object
            required:
              - order
              - lat
              - lng
            properties:
              order:
                type: number
              lat:
                type: number
              lng:
                type: number
        amot:
          type: array
          items:
            type: string
          example: ["run", "bike"]
        start_window:
          type: string
          description: ISO8601 or epoch
        invite_code:
          type: string
        paid:
          type: boolean
        created_at:
          type: string
        organizer_id:
          type: string
          nullable: true

    LeaderboardResponse:
      type: object
      required:
        - race_id
        - race_name
        - entries
      properties:
        race_id:
          type: string
        race_name:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardEntry'

    LeaderboardEntry:
      type: object
      required:
        - user_id
        - name
        - status
      properties:
        user_id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [finished, in_progress, dnf]
        finish_time_ms:
          type: integer
          description: Elapsed milliseconds; only when status is finished
        placement:
          type: integer
          description: 1-based place; only when status is finished

    ParticipationRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [in_progress, finished]
        finish_time_ms:
          type: integer
          minimum: 1
          maximum: 86400000
          exclusiveMaximum: true
          description: Required when status is finished. Client-reported elapsed ms.

    ParticipationResponse:
      type: object
      required:
        - race_id
        - user_id
        - status
      properties:
        race_id:
          type: string
        user_id:
          type: string
        status:
          type: string
          enum: [in_progress, finished]
        finish_time_ms:
          type: integer
        placement:
          type: integer
